    <title>EINSoft GPS Tracker</title>
    <script type="module" crossorigin src="/assets/index-51e370d4.js"></script>
    <link rel="stylesheet" href="/assets/index-419a4255.css">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased select-none">
    <div id="root"></div>
    
    <script>
      // Registrar Service Worker para background GPS sync
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('[EYE-NODE] Service Worker registrado:', reg.scope);
              // Solicitar Periodic Background Sync si está disponible
              if ('periodicSync' in reg) {
                navigator.permissions.query({ name: 'periodic-background-sync' })
                  .then(status => {
                    if (status.state === 'granted') {
                      reg.periodicSync.register('gps-periodic-sync', { minInterval: 5 * 60 * 1000 });
                    }
                  }).catch(() => {});
              }
            })
            .catch(err => console.warn('[EYE-NODE] SW error:', err));
        });
      }
    </script>
  </body>
